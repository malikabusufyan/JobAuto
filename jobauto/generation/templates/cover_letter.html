<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: Letter; margin: 0.9in; }
  body { font-family: Georgia, 'Times New Roman', serif; color: #1a1a1a; font-size: 11pt; line-height: 1.5; }
  .header { margin-bottom: 24px; }
  .header .name { font-size: 14pt; font-weight: bold; }
  .header .contact { font-size: 9.5pt; color: #444; }
  .date { margin-bottom: 18px; }
  p { margin: 0 0 12px 0; white-space: pre-wrap; }
</style>
</head>
<body>
  <div class="header">
    <div class="name">{{ personal.full_name }}</div>
    <div class="contact">{{ personal.email }} | {{ personal.phone }} | {{ personal.location }}</div>
  </div>
  <div class="date">{{ date }}</div>
  <div>Re: {{ job_title }} at {{ company }}</div>
  <br>
  {% for paragraph in paragraphs %}
  <p>{{ paragraph }}</p>
  {% endfor %}
</body>
</html>
